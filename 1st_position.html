<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>芭蕾手部第一位置（手腕寬距大抱圓版）</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background: #000;
    }
    video { 
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .hud-header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 3px solid #00E676;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
      z-index: 10;
    }
    .timer-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: 4px solid #FF5252;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
      z-index: 10;
    }
    .timer-badge span {
      font-size: 11px;
      color: #aaa;
      margin-top: -2px;
    }
    .energy-bar-container {
      position: absolute;
      right: 25px;
      top: 100px;
      bottom: 100px;
      width: 28px;
      background: rgba(255,255,255,0.15);
      border: 2px solid #fff;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      z-index: 10;
    }
    .energy-bar-fill {
      width: 100%;
      height: 0%;
      background: #FF5252;
      transition: height 0.1s ease-out, background-color 0.2s;
    }
    .score-text {
      position: absolute;
      right: 15px;
      bottom: 60px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      width: 50px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="stage-container">
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="output-canvas"></canvas>

  <div class="timer-badge" id="timer-badge">
    <div id="hold-sec">0</div>
    <span>HOLD(S)</span>
  </div>

  <div class="hud-header" id="status-card">
    請入鏡，手肘架圓、雙手抱圓
  </div>

  <div class="energy-bar-container">
    <div class="energy-bar-fill" id="energy-fill"></div>
  </div>
  <div class="score-text" id="score-text">0%</div>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output-canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const statusCard = document.getElementById('status-card');
  const energyFill = document.getElementById('energy-fill');
  const scoreText = document.getElementById('score-text');
  const holdSecText = document.getElementById('hold-sec');
  const timerBadge = document.getElementById('timer-badge');

  let holdCounter = 0;

  function calculateAngle(a, b, c) {
    const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let angle = Math.abs(radians * 180.0 / Math.PI);
    if (angle > 180.0) angle = 360 - angle;
    return Math.round(angle);
  }

  function onResults(results) {
    if (!results.image) return;

    canvasElement.width = videoElement.videoWidth || 1280;
    canvasElement.height = videoElement.videoHeight || 720;
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);
    canvasCtx.drawImage(results.image, 0, 0, w, h);

    let accuracy = 0;
    let status = "請入鏡，手肘架圓、雙手抱圓";
    let statusColor = "#FFA726";

    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const lShoulder = lm[11], rShoulder = lm[12];
      const lElbow = lm[13], rElbow = lm[14];
      const lWrist = lm[15], rWrist = lm[16];
      const lPinky = lm[17], rPinky = lm[18];
      const lIndex = lm[19], rIndex = lm[20];
      const lThumb = lm[21], rThumb = lm[22];

      const shoulderWidth = Math.abs(lShoulder.x - rShoulder.x);
      const elbowWidth = Math.abs(lElbow.x - rElbow.x);
      const wristDist = Math.abs(lWrist.x - rWrist.x);
      const fingerTipDist = Math.abs(lIndex.x - rIndex.x);

      const avgShoulderY = (lShoulder.y + rShoulder.y) / 2;
      const avgWristY = (lWrist.y + rWrist.y) / 2;

      // 1. 指尖防重疊檢核（不可交疊，且指尖留有微距）
      const isFingersNotOverlapped = (fingerTipDist >= shoulderWidth * 0.15);
      const isFingersNotTooFar = (fingerTipDist <= shoulderWidth * 0.85);
      const isFingersValid = isFingersNotOverlapped && isFingersNotTooFar;

      // 2. 手腕間距大幅拓寬（改為肩寬的 0.95 ~ 2.10 倍，包容手腕開展到肩外側的弧度）
      const isWristSpanGood = (wristDist >= shoulderWidth * 0.95 && wristDist <= shoulderWidth * 2.10);

      // 3. 手肘向外撐開（手肘寬度需大於手腕寬度且大於肩寬）
      const isElbowFlared = (elbowWidth >= shoulderWidth * 1.15) && (elbowWidth >= wristDist * 0.95);

      // 4. 高度檢核（手腕在下胸與肚臍之間）
      const wristDepth = avgWristY - avgShoulderY;
      const isHeightGood = (wristDepth >= shoulderWidth * 0.35 && wristDepth <= shoulderWidth * 1.10);

      // 5. 手肘圓弧度與左右對稱
      const leftElbowAngle = calculateAngle(lShoulder, lElbow, lWrist);
      const rightElbowAngle = calculateAngle(rShoulder, rElbow, rWrist);
      const isAngleGood = (leftElbowAngle >= 75 && leftElbowAngle <= 155 && rightElbowAngle >= 75 && rightElbowAngle <= 155);

      const elbowHeightDiff = Math.abs(lElbow.y - rElbow.y);
      const wristHeightDiff = Math.abs(lWrist.y - rWrist.y);
      const isSymmetric = (elbowHeightDiff <= shoulderWidth * 0.16) && (wristHeightDiff <= shoulderWidth * 0.18);

      // 權重配置
      let scoreFingers = 0;
      if (isFingersValid) {
        scoreFingers = 30;
      } else if (!isFingersNotOverlapped) {
        scoreFingers = 0; // 重疊直接扣光
      } else {
        scoreFingers = 10;
      }

      let scoreWrist = isWristSpanGood ? 30 : 10;
      let scoreFlare = isElbowFlared ? 20 : 0;
      let scoreHeight = isHeightGood ? 10 : 5;
      let scoreSymmetryAndAngle = (isAngleGood && isSymmetric) ? 10 : 5;

      accuracy = Math.min(100, Math.max(0, scoreFingers + scoreWrist + scoreFlare + scoreHeight + scoreSymmetryAndAngle));

      // 繪製骨骼線
      function drawBone(p1, p2, color, thickness) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x * w, p1.y * h);
        canvasCtx.lineTo(p2.x * w, p2.y * h);
        canvasCtx.lineWidth = thickness;
        canvasCtx.strokeStyle = color;
        canvasCtx.stroke();
      }

      drawBone(lShoulder, rShoulder, '#FFFFFF', 3);
      drawBone(lShoulder, lElbow, '#00E5FF', 4);
      drawBone(lElbow, lWrist, '#00E5FF', 4);
      drawBone(rShoulder, rElbow, '#00E5FF', 4);
      drawBone(rElbow, rWrist, '#00E5FF', 4);

      drawBone(lWrist, lIndex, '#E040FB', 2);
      drawBone(lWrist, lThumb, '#E040FB', 2);
      drawBone(lIndex, lPinky, '#E040FB', 2);
      drawBone(rWrist, rIndex, '#E040FB', 2);
      drawBone(rWrist, rThumb, '#E040FB', 2);
      drawBone(rIndex, rPinky, '#E040FB', 2);

      // 指尖輔助線
      drawBone(lIndex, rIndex, (!isFingersNotOverlapped) ? '#FF5252' : (accuracy >= 85 ? '#00E676' : 'rgba(255,255,255,0.4)'), 2);
      // 手肘水平對稱線
      drawBone(lElbow, rElbow, isSymmetric ? 'rgba(0,230,118,0.4)' : 'rgba(255,82,82,0.3)', 1);

      const keyPoints = [
        lShoulder, rShoulder, lElbow, rElbow, 
        lWrist, rWrist, 
        lPinky, rPinky, lIndex, rIndex, lThumb, rThumb
      ];

      keyPoints.forEach(p => {
        canvasCtx.beginPath();
        canvasCtx.arc(p.x * w, p.y * h, 6, 0, 2 * Math.PI);
        canvasCtx.fillStyle = accuracy >= 85 ? '#00E676' : '#00E5FF';
        canvasCtx.fill();
        canvasCtx.lineWidth = 1.5;
        canvasCtx.strokeStyle = '#FFFFFF';
        canvasCtx.stroke();
      });

      // 狀態提示反饋
      if (accuracy >= 85) {
        status = "PERFECT 1ST POSITION! 完美一位手!";
        statusColor = "#00E676";
        holdCounter++;
      } else {
        holdCounter = Math.max(0, holdCounter - 1);
        if (!isFingersNotOverlapped) {
          status = "指尖切勿互相交疊！保留一顆蘋果微距！";
          statusColor = "#FF5252";
        } else if (wristDist < shoulderWidth * 0.95) {
          status = "雙手手腕微放寬，讓抱圓更舒展開展！";
          statusColor = "#FFA726";
        } else if (wristDist > shoulderWidth * 2.10) {
          status = "雙手稍微向內合攏抱圓！";
          statusColor = "#FFA726";
        } else if (!isElbowFlared) {
          status = "手肘向外撐開架圓，切勿貼緊身側！";
          statusColor = "#FF5252";
        } else if (!isHeightGood) {
          status = avgWristY < avgShoulderY + shoulderWidth * 0.35 ? "沉肩！手腕放低至下胸！" : "手腕微提，對齊下胸前方！";
          statusColor = "#FFA726";
        } else if (!isSymmetric) {
          status = lElbow.y > rElbow.y ? "左手肘微抬，保持兩側等高！" : "右手肘微抬，保持兩側等高！";
          statusColor = "#FF5252";
        } else {
          status = "沉肩長頸，維持優雅抱圓！";
          statusColor = "#FFA726";
        }
      }
    }

    const holdSeconds = Math.floor(holdCounter / 20);
    holdSecText.innerText = holdSeconds;
    scoreText.innerText = accuracy + "%";
    energyFill.style.height = accuracy + "%";

    if (accuracy >= 85) {
      energyFill.style.backgroundColor = "#00E676";
      timerBadge.style.borderColor = "#00E676";
    } else {
      energyFill.style.backgroundColor = "#FF5252";
      timerBadge.style.borderColor = "#FF5252";
    }

    statusCard.innerText = status;
    statusCard.style.borderColor = statusColor;
    statusCard.style.color = statusColor;

    canvasCtx.restore();
  }

  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  camera.start().catch((err) => {
    console.error("Camera error:", err);
    statusCard.innerText = "無法開啟相機，請檢查瀏覽器相機權限！";
    statusCard.style.borderColor = "#FF5252";
    statusCard.style.color = "#FF5252";
  });
</script>
</body>
</html>
