<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>芭蕾手部第一位置（First Position）體感評測機</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background: #000;
    }
    video { 
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .hud-header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 3px solid #00E676;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
      z-index: 10;
    }
    .timer-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: 4px solid #FF5252;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
      z-index: 10;
    }
    .timer-badge span {
      font-size: 11px;
      color: #aaa;
      margin-top: -2px;
    }
    .energy-bar-container {
      position: absolute;
      right: 25px;
      top: 100px;
      bottom: 100px;
      width: 28px;
      background: rgba(255,255,255,0.15);
      border: 2px solid #fff;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      z-index: 10;
    }
    .energy-bar-fill {
      width: 100%;
      height: 0%;
      background: #FF5252;
      transition: height 0.1s ease-out, background-color 0.2s;
    }
    .score-text {
      position: absolute;
      right: 15px;
      bottom: 60px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      width: 50px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="stage-container">
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="output-canvas"></canvas>

  <div class="timer-badge" id="timer-badge">
    <div id="hold-sec">0</div>
    <span>HOLD(S)</span>
  </div>

  <div class="hud-header" id="status-card">
    請入鏡，手肘架圓、雙手於下胸抱圓
  </div>

  <div class="energy-bar-container">
    <div class="energy-bar-fill" id="energy-fill"></div>
  </div>
  <div class="score-text" id="score-text">0%</div>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output-canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const statusCard = document.getElementById('status-card');
  const energyFill = document.getElementById('energy-fill');
  const scoreText = document.getElementById('score-text');
  const holdSecText = document.getElementById('hold-sec');
  const timerBadge = document.getElementById('timer-badge');

  let holdCounter = 0;

  function calculateAngle(a, b, c) {
    const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let angle = Math.abs(radians * 180.0 / Math.PI);
    if (angle > 180.0) angle = 360 - angle;
    return Math.round(angle);
  }

  function onResults(results) {
    if (!results.image) return;

    canvasElement.width = videoElement.videoWidth || 1280;
    canvasElement.height = videoElement.videoHeight || 720;
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);
    canvasCtx.drawImage(results.image, 0, 0, w, h);

    let accuracy = 0;
    let status = "請入鏡，手肘架圓、雙手於下胸抱圓";
    let statusColor = "#FFA726";

    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const lShoulder = lm[11], rShoulder = lm[12];
      const lElbow = lm[13], rElbow = lm[14];
      const lWrist = lm[15], rWrist = lm[16];

      const shoulderWidth = Math.abs(lShoulder.x - rShoulder.x);
      const elbowWidth = Math.abs(lElbow.x - rElbow.x);
      const wristWidth = Math.abs(lWrist.x - rWrist.x);

      const avgShoulderY = (lShoulder.y + rShoulder.y) / 2;
      const avgElbowY = (lElbow.y + rElbow.y) / 2;
      const avgWristY = (lWrist.y + rWrist.y) / 2;

      // --- 核心條件 1：手肘必須向外架開（打破垂直下垂）---
      // 芭蕾一位手的手肘寬度必然大於肩膀寬度（通常在 1.15 到 1.6 倍之間）
      const isElbowFlared = (elbowWidth >= shoulderWidth * 1.15);
      // 手腕間距必須明顯窄於手肘寬度（前臂往內包）
      const isWristEnclosed = (wristWidth < elbowWidth * 0.85);

      // --- 核心條件 2：手肘高度不可塌掉 ---
      // 手肘在肩膀下方約 0.2 ~ 0.55 個肩寬
      const elbowDepth = avgElbowY - avgShoulderY;
      const isElbowHeightGood = (elbowDepth >= shoulderWidth * 0.15 && elbowDepth <= shoulderWidth * 0.58);

      // --- 核心條件 3：手腕高度位於下胸腹前 ---
      const wristDepth = avgWristY - avgShoulderY;
      const isWristHeightGood = (wristDepth >= shoulderWidth * 0.40 && wristDepth <= shoulderWidth * 0.95);

      // --- 核心條件 4：手肘關節弧度 ---
      const leftElbowAngle = calculateAngle(lShoulder, lElbow, lWrist);
      const rightElbowAngle = calculateAngle(rShoulder, rElbow, rWrist);
      const isAngleGood = (leftElbowAngle >= 95 && leftElbowAngle <= 145 && rightElbowAngle >= 95 && rightElbowAngle <= 145);

      // --- 核心條件 5：左右高度對稱性 ---
      const elbowHeightDiff = Math.abs(lElbow.y - rElbow.y);
      const wristHeightDiff = Math.abs(lWrist.y - rWrist.y);
      const isSymmetric = (elbowHeightDiff <= shoulderWidth * 0.12) && (wristHeightDiff <= shoulderWidth * 0.15);

      // 計分分配
      let scoreFlare = (isElbowFlared && isWristEnclosed) ? 35 : 0; // 手肘沒架開直接扣光
      let scoreHeight = (isElbowHeightGood && isWristHeightGood) ? 25 : 5;
      let scoreAngle = isAngleGood ? 20 : 5;
      let scoreSymmetry = isSymmetric ? 20 : 5;

      accuracy = Math.min(100, Math.max(0, scoreFlare + scoreHeight + scoreAngle + scoreSymmetry));

      // 繪製科技骨骼線
      function drawBone(p1, p2, color, thickness) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x * w, p1.y * h);
        canvasCtx.lineTo(p2.x * w, p2.y * h);
        canvasCtx.lineWidth = thickness;
        canvasCtx.strokeStyle = color;
        canvasCtx.stroke();
      }

      drawBone(lShoulder, rShoulder, '#FFFFFF', 3);
      drawBone(lShoulder, lElbow, '#00E5FF', 4);
      drawBone(lElbow, lWrist, '#00E5FF', 4);
      drawBone(rShoulder, rElbow, '#00E5FF', 4);
      drawBone(rElbow, rWrist, '#00E5FF', 4);
      drawBone(lWrist, rWrist, accuracy >= 85 ? '#00E676' : 'rgba(255,255,255,0.4)', 2);
      drawBone(lElbow, rElbow, isSymmetric ? 'rgba(0,230,118,0.5)' : 'rgba(255,82,82,0.4)', 1);

      const pts = [lShoulder, rShoulder, lElbow, rElbow, lWrist, rWrist];
      pts.forEach(p => {
        canvasCtx.beginPath();
        canvasCtx.arc(p.x * w, p.y * h, 7, 0, 2 * Math.PI);
        canvasCtx.fillStyle = accuracy >= 85 ? '#00E676' : '#E040FB';
        canvasCtx.fill();
        canvasCtx.lineWidth = 2;
        canvasCtx.strokeStyle = '#FFFFFF';
        canvasCtx.stroke();
      });

      // 狀態提示反饋
      if (accuracy >= 85) {
        status = "PERFECT FIRST POSITION! 完美對稱一位手!";
        statusColor = "#00E676";
        holdCounter++;
      } else {
        holdCounter = Math.max(0, holdCounter - 1);
        if (!isElbowFlared) {
          status = "錯誤！手肘向外撐開抱圓，勿垂在身側！";
          statusColor = "#FF5252";
        } else if (!isSymmetric) {
          status = lElbow.y > rElbow.y ? "左手肘微抬，保持兩側等高！" : "右手肘微抬，保持兩側等高！";
          statusColor = "#FF5252";
        } else if (!isWristHeightGood) {
          status = avgWristY < avgShoulderY + shoulderWidth * 0.40 ? "沉肩！手腕放低至下胸！" : "手腕微提，對齊下胸前方！";
          statusColor = "#FF5252";
        } else if (!isAngleGood) {
          status = "手肘微曲維持圓潤，切勿伸直！";
          statusColor = "#FFA726";
        } else {
          status = "沉肩長頸，維持核心抱圓！";
          statusColor = "#FFA726";
        }
      }
    }

    const holdSeconds = Math.floor(holdCounter / 20);
    holdSecText.innerText = holdSeconds;
    scoreText.innerText = accuracy + "%";
    energyFill.style.height = accuracy + "%";

    if (accuracy >= 85) {
      energyFill.style.backgroundColor = "#00E676";
      timerBadge.style.borderColor = "#00E676";
    } else {
      energyFill.style.backgroundColor = "#FF5252";
      timerBadge.style.borderColor = "#FF5252";
    }

    statusCard.innerText = status;
    statusCard.style.borderColor = statusColor;
    statusCard.style.color = statusColor;

    canvasCtx.restore();
  }

  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  camera.start().catch((err) => {
    console.error("Camera error:", err);
    statusCard.innerText = "無法開啟相機，請檢查瀏覽器相機權限！";
    statusCard.style.borderColor = "#FF5252";
    statusCard.style.color = "#FF5252";
  });
</script>
</body>
</html>
