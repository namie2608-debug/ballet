<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>芭蕾一位手（First Position）體感訓練機</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background: #000;
    }
    video { display: none; }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .hud-header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 3px solid #00E676;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .timer-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: 4px solid #FF5252;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
    }
    .timer-badge span {
      font-size: 11px;
      color: #aaa;
      margin-top: -2px;
    }
    .energy-bar-container {
      position: absolute;
      right: 25px;
      top: 100px;
      bottom: 100px;
      width: 28px;
      background: rgba(255,255,255,0.15);
      border: 2px solid #fff;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
    }
    .energy-bar-fill {
      width: 100%;
      height: 0%;
      background: #FF5252;
      transition: height 0.1s ease-out, background-color 0.2s;
    }
    .score-text {
      position: absolute;
      right: 15px;
      bottom: 60px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      width: 50px;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="stage-container">
  <video id="webcam" playsinline></video>
  <canvas id="output-canvas"></canvas>

  <div class="timer-badge" id="timer-badge">
    <div id="hold-sec">0</div>
    <span>HOLD(S)</span>
  </div>

  <div class="hud-header" id="status-card">
    雙手向前抱圓，啟動一位手
  </div>

  <div class="energy-bar-container">
    <div class="energy-bar-fill" id="energy-fill"></div>
  </div>
  <div class="score-text" id="score-text">0%</div>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output-canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const statusCard = document.getElementById('status-card');
  const energyFill = document.getElementById('energy-fill');
  const scoreText = document.getElementById('score-text');
  const holdSecText = document.getElementById('hold-sec');
  const timerBadge = document.getElementById('timer-badge');

  let holdCounter = 0;

  function calculateAngle(a, b, c) {
    const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let angle = Math.abs(radians * 180.0 / Math.PI);
    if (angle > 180.0) angle = 360 - angle;
    return Math.round(angle);
  }

  function onResults(results) {
    canvasElement.width = videoElement.videoWidth;
    canvasElement.height = videoElement.videoHeight;
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);
    canvasCtx.drawImage(results.image, 0, 0, w, h);

    let accuracy = 0;
    let status = "雙手向前抱圓，啟動一位手";
    let statusColor = "#FFA726";

    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const lShoulder = lm[11], rShoulder = lm[12];
      const lElbow = lm[13], rElbow = lm[14];
      const lWrist = lm[15], rWrist = lm[16];

      // 1. 計算手肘夾角 (肩膀-手肘-手腕)
      const leftElbowAngle = calculateAngle(lShoulder, lElbow, lWrist);
      const rightElbowAngle = calculateAngle(rShoulder, rElbow, rWrist);

      // 2. 距離計算
      const shoulderWidth = Math.abs(lShoulder.x - rShoulder.x);
      const wristDist = Math.abs(lWrist.x - rWrist.x);

      // 3. 高度關係
      const avgShoulderY = (lShoulder.y + rShoulder.y) / 2;
      const avgWristY = (lWrist.y + rWrist.y) / 2;
      const avgElbowY = (lElbow.y + rElbow.y) / 2;

      // 評分一：手肘折角 (針對前傾抱圓視角，放寬為 85° ~ 150°) 滿分 40
      let scoreElbow = 0;
      if (leftElbowAngle >= 85 && leftElbowAngle <= 150 && rightElbowAngle >= 85 && rightElbowAngle <= 150) {
        scoreElbow = 40;
      } else if (leftElbowAngle > 150 || rightElbowAngle > 150) {
        scoreElbow = 15; // 手臂太直
      } else {
        scoreElbow = 20;
      }

      // 評分二：手腕間距 (以照片為基準，放寬至肩寬的 0.3 到 1.1 倍) 滿分 30
      let scoreDist = 0;
      if (wristDist >= shoulderWidth * 0.25 && wristDist <= shoulderWidth * 1.1) {
        scoreDist = 30;
      } else {
        scoreDist = 15;
      }

      // 評分三：高度判定 (手腕與手肘低於肩膀，但手腕在腹前) 滿分 30
      let scoreHeight = 0;
      if (avgWristY > avgShoulderY + 0.03 && avgElbowY > avgShoulderY) {
        scoreHeight = 30;
      } else {
        scoreHeight = 10;
      }

      accuracy = Math.min(100, Math.max(0, scoreElbow + scoreDist + scoreHeight));

      // 繪製骨骼線
      function drawBone(p1, p2, color, thickness) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x * w, p1.y * h);
        canvasCtx.lineTo(p2.x * w, p2.y * h);
        canvasCtx.lineWidth = thickness;
        canvasCtx.strokeStyle = color;
        canvasCtx.stroke();
      }

      drawBone(lShoulder, rShoulder, '#FFFFFF', 3);
      drawBone(lShoulder, lElbow, '#E040FB', 4);
      drawBone(lElbow, lWrist, '#E040FB', 4);
      drawBone(rShoulder, rElbow, '#E040FB', 4);
      drawBone(rElbow, rWrist, '#E040FB', 4);
      drawBone(lWrist, rWrist, accuracy >= 85 ? '#00E676' : 'rgba(255,255,255,0.4)', 2);

      const pts = [lShoulder, rShoulder, lElbow, rElbow, lWrist, rWrist];
      pts.forEach(p => {
        canvasCtx.beginPath();
        canvasCtx.arc(p.x * w, p.y * h, 7, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#00E676';
        canvasCtx.fill();
        canvasCtx.lineWidth = 2;
        canvasCtx.strokeStyle = '#FFFFFF';
        canvasCtx.stroke();
      });

      // 狀態提示與倒數
      if (accuracy >= 85) {
        status = "PERFECT FIRST POSITION! 優雅一位手!";
        statusColor = "#00E676";
        holdCounter++;
      } else {
        holdCounter = Math.max(0, holdCounter - 1);
        if (scoreHeight < 20) {
          status = "沉肩！手腕置於肚臍前方！";
          statusColor = "#FF5252";
        } else if (scoreElbow < 30) {
          status = "手肘微曲抱圓，切勿鎖死！";
          statusColor = "#FF5252";
        } else {
          status = "收腹沉肩，維持圓潤弧線！";
          statusColor = "#FFA726";
        }
      }
    }

    const holdSeconds = Math.floor(holdCounter / 20);
    holdSecText.innerText = holdSeconds;
    scoreText.innerText = accuracy + "%";
    energyFill.style.height = accuracy + "%";

    if (accuracy >= 85) {
      energyFill.style.backgroundColor = "#00E676";
      timerBadge.style.borderColor = "#00E676";
    } else {
      energyFill.style.backgroundColor = "#FF5252";
      timerBadge.style.borderColor = "#FF5252";
    }

    statusCard.innerText = status;
    statusCard.style.borderColor = statusColor;
    statusCard.style.color = statusColor;

    canvasCtx.restore();
  }

  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  camera.start();
</script>
</body>
</html>
