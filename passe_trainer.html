<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>芭蕾 Passé 體感雷達訓練機</title>
  <!-- 載入 Google 官方 MediaPipe Camera 與 Pose 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background: #000;
    }
    video { display: none; }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 水平翻轉，達成鏡像效果 */
    }
    /* 頂部 HUD 面板 */
    .hud-header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 2px solid #00E676;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s;
    }
    /* 左上角秒數計時球 */
    .timer-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: 4px solid #FF5252;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
    }
    .timer-badge span {
      font-size: 11px;
      color: #aaa;
      margin-top: -2px;
    }
    /* 右側能量進度槽 */
    .energy-bar-container {
      position: absolute;
      right: 25px;
      top: 100px;
      bottom: 100px;
      width: 28px;
      background: rgba(255,255,255,0.15);
      border: 2px solid #fff;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
    }
    .energy-bar-fill {
      width: 100%;
      height: 0%;
      background: #FF5252;
      transition: height 0.1s ease-out, background-color 0.2s;
    }
    .score-text {
      position: absolute;
      right: 15px;
      bottom: 60px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      width: 50px;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="stage-container">
  <video id="webcam" playsinline></video>
  <canvas id="output-canvas"></canvas>

  <div class="timer-badge" id="timer-badge">
    <div id="hold-sec">0</div>
    <span>HOLD(S)</span>
  </div>

  <div class="hud-header" id="status-card">
    請退後，全身站入畫面
  </div>

  <div class="energy-bar-container">
    <div class="energy-bar-fill" id="energy-fill"></div>
  </div>
  <div class="score-text" id="score-text">0%</div>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output-canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const statusCard = document.getElementById('status-card');
  const energyFill = document.getElementById('energy-fill');
  const scoreText = document.getElementById('score-text');
  const holdSecText = document.getElementById('hold-sec');
  const timerBadge = document.getElementById('timer-badge');

  let holdCounter = 0;

  function calculateAngle(a, b, c) {
    const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let angle = Math.abs(radians * 180.0 / Math.PI);
    if (angle > 180.0) angle = 360 - angle;
    return Math.round(angle);
  }

  function onResults(results) {
    canvasElement.width = videoElement.videoWidth;
    canvasElement.height = videoElement.videoHeight;
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);
    canvasCtx.drawImage(results.image, 0, 0, w, h);

    let accuracy = 0;
    let status = "全身入鏡，準備鎖定姿勢";
    let statusColor = "#FFA726";

    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const lHip = lm[23], rHip = lm[24];
      const lKnee = lm[25], rKnee = lm[26];
      const lAnkle = lm[27], rAnkle = lm[28];

      // 計算左腿（支撐腿）與右腿（提膝腿）角度
      const leftAngle = calculateAngle(lHip, lKnee, lAnkle);
      const rightAngle = calculateAngle(rHip, rKnee, rAnkle);

      // 芭蕾力學核對
      // 1. 支撐腿扎根 (滿分 50)
      let scoreSupport = 0;
      if (leftAngle >= 165) scoreSupport = 50;
      else if (leftAngle >= 140) scoreSupport = Math.round((leftAngle - 140) / 25 * 50);

      // 2. 提膝腿外開折疊 + 腳踝貼膝 (滿分 50)
      const ankleLifted = rAnkle.y < (lKnee.y + 0.05);
      let scorePasse = 0;

      if (rightAngle >= 40 && rightAngle <= 95 && ankleLifted) {
        scorePasse = 50;
      } else if (rightAngle > 140) {
        scorePasse = 0; // 雙腿站立封殺！
      } else {
        scorePasse = 20;
        if (!ankleLifted) scorePasse = 0;
      }

      accuracy = Math.min(100, Math.max(0, scoreSupport + scorePasse));

      // 繪製關節點與科技連線
      const pts = [lHip, rHip, lKnee, rKnee, lAnkle, rAnkle];
      pts.forEach(p => {
        canvasCtx.beginPath();
        canvasCtx.arc(p.x * w, p.y * h, 7, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#E040FB';
        canvasCtx.fill();
        canvasCtx.lineWidth = 2;
        canvasCtx.strokeStyle = '#FFFFFF';
        canvasCtx.stroke();
      });

      function drawBone(p1, p2) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x * w, p1.y * h);
        canvasCtx.lineTo(p2.x * w, p2.y * h);
        canvasCtx.lineWidth = 4;
        canvasCtx.strokeStyle = '#FFFFFF';
        canvasCtx.stroke();
      }

      drawBone(lHip, lKnee); drawBone(lKnee, lAnkle);
      drawBone(rHip, rKnee); drawBone(rKnee, rAnkle);

      // 狀態字卡回饋
      if (accuracy >= 85) {
        status = "PERFECT PASSE! 完美皇家線條!";
        statusColor = "#00E676";
        holdCounter++;
      } else {
        holdCounter = Math.max(0, holdCounter - 1);
        if (leftAngle < 160) {
          status = "注意！左腳扎根打直！";
          statusColor = "#FF5252";
        } else if (rightAngle > 120 || !ankleLifted) {
          status = "注意！右膝向外提、腳尖貼膝！";
          statusColor = "#FF5252";
        } else {
          status = "收緊核心！穩住呼吸！";
          statusColor = "#FFA726";
        }
      }
    }

    // 更新網頁 UI
    const holdSeconds = Math.floor(holdCounter / 20);
    holdSecText.innerText = holdSeconds;
    scoreText.innerText = accuracy + "%";
    energyFill.style.height = accuracy + "%";
    
    if (accuracy >= 85) {
      energyFill.style.backgroundColor = "#00E676";
      timerBadge.style.borderColor = "#00E676";
    } else {
      energyFill.style.backgroundColor = "#FF5252";
      timerBadge.style.borderColor = "#FF5252";
    }

    statusCard.innerText = status;
    statusCard.style.borderColor = statusColor;
    statusCard.style.color = statusColor;

    canvasCtx.restore();
  }

  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  camera.start();
</script>
</body>
</html>
