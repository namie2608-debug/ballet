<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>芭蕾第二位置（Seconde Position）斜前下弧度評測機</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background: #000;
    }
    video { 
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .hud-header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 3px solid #00E676;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
      z-index: 10;
    }
    .timer-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: 4px solid #FF5252;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
      z-index: 10;
    }
    .timer-badge span {
      font-size: 11px;
      color: #aaa;
      margin-top: -2px;
    }
    .energy-bar-container {
      position: absolute;
      right: 25px;
      top: 100px;
      bottom: 100px;
      width: 28px;
      background: rgba(255,255,255,0.15);
      border: 2px solid #fff;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      z-index: 10;
    }
    .energy-bar-fill {
      width: 100%;
      height: 0%;
      background: #FF5252;
      transition: height 0.1s ease-out, background-color 0.2s;
    }
    .score-text {
      position: absolute;
      right: 15px;
      bottom: 60px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      width: 50px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="stage-container">
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="output-canvas"></canvas>

  <div class="timer-badge" id="timer-badge">
    <div id="hold-sec">0</div>
    <span>HOLD(S)</span>
  </div>

  <div class="hud-header" id="status-card">
    雙臂向兩側斜前下方展開（二位手）
  </div>

  <div class="energy-bar-container">
    <div class="energy-bar-fill" id="energy-fill"></div>
  </div>
  <div class="score-text" id="score-text">0%</div>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output-canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const statusCard = document.getElementById('status-card');
  const energyFill = document.getElementById('energy-fill');
  const scoreText = document.getElementById('score-text');
  const holdSecText = document.getElementById('hold-sec');
  const timerBadge = document.getElementById('timer-badge');

  let holdCounter = 0;

  function calculateAngle(a, b, c) {
    const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let angle = Math.abs(radians * 180.0 / Math.PI);
    if (angle > 180.0) angle = 360 - angle;
    return Math.round(angle);
  }

  function onResults(results) {
    if (!results.image) return;

    canvasElement.width = videoElement.videoWidth || 1280;
    canvasElement.height = videoElement.videoHeight || 720;
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);
    canvasCtx.drawImage(results.image, 0, 0, w, h);

    let accuracy = 0;
    let status = "雙臂向兩側斜前下方展開（二位手）";
    let statusColor = "#FFA726";

    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const lShoulder = lm[11], rShoulder = lm[12];
      const lElbow = lm[13], rElbow = lm[14];
      const lWrist = lm[15], rWrist = lm[16];
      const lPinky = lm[17], rPinky = lm[18];
      const lIndex = lm[19], rIndex = lm[20];
      const lThumb = lm[21], rThumb = lm[22];

      const shoulderWidth = Math.abs(lShoulder.x - rShoulder.x);
      const wingspan = Math.abs(lIndex.x - rIndex.x);

      // --- 條件 1：水滴滑水道斜率（手肘微低於肩、手腕微低於手肘） ---
      // Y 軸越大代表越低。手肘必須在肩膀下方 0.08~0.35 個肩寬；手腕在手肘下方 0.05~0.3 個肩寬
      const lElbowSlope = (lElbow.y - lShoulder.y) >= shoulderWidth * 0.05 && (lElbow.y - lShoulder.y) <= shoulderWidth * 0.45;
      const rElbowSlope = (rElbow.y - rShoulder.y) >= shoulderWidth * 0.05 && (rElbow.y - rShoulder.y) <= shoulderWidth * 0.45;
      
      const lWristSlope = (lWrist.y - lElbow.y) >= shoulderWidth * 0.03 && (lWrist.y - lElbow.y) <= shoulderWidth * 0.40;
      const rWristSlope = (rWrist.y - rElbow.y) >= shoulderWidth * 0.03 && (rWrist.y - rElbow.y) <= shoulderWidth * 0.40;

      const isDownwardSlope = lElbowSlope && rElbowSlope && lWristSlope && rWristSlope;

      // 檢查是否水平平舉（若是水平平舉直接抓包扣分）
      const isHorizontalFlat = (Math.abs(lWrist.y - lShoulder.y) < shoulderWidth * 0.08) || 
                               (Math.abs(rWrist.y - rShoulder.y) < shoulderWidth * 0.08);

      // --- 條件 2：立體前向角度（手腕必須在肩膀前方，不可平舉或後甩） ---
      // MediaPipe 的 z 軸越小表示離鏡頭越近（更在前方）
      const isForwardLeft = (lWrist.z < lShoulder.z - 0.05);
      const isForwardRight = (rWrist.z < rShoulder.z - 0.05);
      const isForwardCurved = isForwardLeft && isForwardRight;

      // --- 條件 3：手肘微曲柔和（不可鎖死在 180°） ---
      const leftElbowAngle = calculateAngle(lShoulder, lElbow, lWrist);
      const rightElbowAngle = calculateAngle(rShoulder, rElbow, rWrist);
      const isElbowCurved = (leftElbowAngle >= 150 && leftElbowAngle <= 172 && rightElbowAngle >= 150 && rightElbowAngle <= 172);

      // --- 條件 4：展開幅度（翼展要開，但不可死伸） ---
      const isSpanGood = (wingspan >= shoulderWidth * 1.8 && wingspan <= shoulderWidth * 2.6);

      // --- 條件 5：左右平衡對稱性 ---
      const elbowDiff = Math.abs(lElbow.y - rElbow.y);
      const wristDiff = Math.abs(lWrist.y - rWrist.y);
      const isSymmetric = (elbowDiff <= shoulderWidth * 0.12) && (wristDiff <= shoulderWidth * 0.14);

      // 評分權重設計
      let scoreSlope = isDownwardSlope ? 35 : (isHorizontalFlat ? 0 : 15);
      let scoreForward = isForwardCurved ? 25 : 10;
      let scoreElbow = isElbowCurved ? 20 : (leftElbowAngle > 175 || rightElbowAngle > 175 ? 5 : 10);
      let scoreSymmetry = isSymmetric ? 20 : 5;

      accuracy = Math.min(100, Math.max(0, scoreSlope + scoreForward + scoreElbow + scoreSymmetry));

      // 繪製骨骼線
      function drawBone(p1, p2, color, thickness) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x * w, p1.y * h);
        canvasCtx.lineTo(p2.x * w, p2.y * h);
        canvasCtx.lineWidth = thickness;
        canvasCtx.strokeStyle = color;
        canvasCtx.stroke();
      }

      drawBone(lShoulder, rShoulder, '#FFFFFF', 3);
      drawBone(lShoulder, lElbow, '#00E5FF', 4);
      drawBone(lElbow, lWrist, '#00E5FF', 4);
      drawBone(rShoulder, rElbow, '#00E5FF', 4);
      drawBone(rElbow, rWrist, '#00E5FF', 4);

      // 手指微結構連線
      drawBone(lWrist, lIndex, '#E040FB', 2);
      drawBone(lWrist, lThumb, '#E040FB', 2);
      drawBone(lIndex, lPinky, '#E040FB', 2);
      drawBone(rWrist, rIndex, '#E040FB', 2);
      drawBone(rWrist, rThumb, '#E040FB', 2);
      drawBone(rIndex, rPinky, '#E040FB', 2);

      // 滑水道輔助線：從肩膀穿過手腕延伸一小段虛擬坡度
      drawBone(lShoulder, lWrist, isDownwardSlope ? 'rgba(0, 230, 118, 0.3)' : 'rgba(255, 82, 82, 0.3)', 1);
      drawBone(rShoulder, rWrist, isDownwardSlope ? 'rgba(0, 230, 118, 0.3)' : 'rgba(255, 82, 82, 0.3)', 1);

      const keyPoints = [
        lShoulder, rShoulder, lElbow, rElbow, 
        lWrist, rWrist, 
        lPinky, rPinky, lIndex, rIndex, lThumb, rThumb
      ];

      keyPoints.forEach(p => {
        canvasCtx.beginPath();
        canvasCtx.arc(p.x * w, p.y * h, 6, 0, 2 * Math.PI);
        canvasCtx.fillStyle = accuracy >= 85 ? '#00E676' : '#00E5FF';
        canvasCtx.fill();
        canvasCtx.lineWidth = 1.5;
        canvasCtx.strokeStyle = '#FFFFFF';
        canvasCtx.stroke();
      });

      // 戲劇與動作結合的即時提示
      if (accuracy >= 85) {
        status = "PERFECT 2ND! 完美斜前下流暢弧度!";
        statusColor = "#00E676";
        holdCounter++;
      } else {
        holdCounter = Math.max(0, holdCounter - 1);
        if (isHorizontalFlat) {
          status = "不要平舉像十字架！雙手微向前、緩緩向下順流！";
          statusColor = "#FF5252";
        } else if (!isDownwardSlope) {
          status = "手腕微低於手肘！維持滑水道弧線！";
          statusColor = "#FF5252";
        } else if (!isForwardCurved) {
          status = "雙手帶到視線餘光內！稍微往身體前方抱！";
          statusColor = "#FFA726";
        } else if (!isElbowCurved) {
          status = "手肘微曲飽滿，切勿完全鎖死伸直！";
          statusColor = "#FFA726";
        } else if (!isSymmetric) {
          status = "左右兩翼等高平衡，核心穩住！";
          statusColor = "#FFA726";
        } else {
          status = "沉肩長頸，氣息從後背流向指尖！";
          statusColor = "#FFA726";
        }
      }
    }

    const holdSeconds = Math.floor(holdCounter / 20);
    holdSecText.innerText = holdSeconds;
    scoreText.innerText = accuracy + "%";
    energyFill.style.height = accuracy + "%";

    if (accuracy >= 85) {
      energyFill.style.backgroundColor = "#00E676";
      timerBadge.style.borderColor = "#00E676";
    } else {
      energyFill.style.backgroundColor = "#FF5252";
      timerBadge.style.borderColor = "#FF5252";
    }

    statusCard.innerText = status;
    statusCard.style.borderColor = statusColor;
    statusCard.style.color = statusColor;

    canvasCtx.restore();
  }

  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  camera.start().catch((err) => {
    console.error("Camera error:", err);
    statusCard.innerText = "無法開啟相機，請檢查瀏覽器相機權限！";
    statusCard.style.borderColor = "#FF5252";
    statusCard.style.color = "#FF5252";
  });
</script>
</body>
</html>
