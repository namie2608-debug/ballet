<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>芭蕾第二位置（防下垂嚴格版）</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background: #000;
    }
    video { 
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .hud-header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 3px solid #00E676;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
      z-index: 10;
    }
    .timer-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: 4px solid #FF5252;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
      z-index: 10;
    }
    .timer-badge span {
      font-size: 11px;
      color: #aaa;
      margin-top: -2px;
    }
    .energy-bar-container {
      position: absolute;
      right: 25px;
      top: 100px;
      bottom: 100px;
      width: 28px;
      background: rgba(255,255,255,0.15);
      border: 2px solid #fff;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      z-index: 10;
    }
    .energy-bar-fill {
      width: 100%;
      height: 0%;
      background: #FF5252;
      transition: height 0.1s ease-out, background-color 0.2s;
    }
    .score-text {
      position: absolute;
      right: 15px;
      bottom: 60px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      width: 50px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="stage-container">
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="output-canvas"></canvas>

  <div class="timer-badge" id="timer-badge">
    <div id="hold-sec">0</div>
    <span>HOLD(S)</span>
  </div>

  <div class="hud-header" id="status-card">
    雙臂向兩側斜前下方展開（二位手）
  </div>

  <div class="energy-bar-container">
    <div class="energy-bar-fill" id="energy-fill"></div>
  </div>
  <div class="score-text" id="score-text">0%</div>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output-canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const statusCard = document.getElementById('status-card');
  const energyFill = document.getElementById('energy-fill');
  const scoreText = document.getElementById('score-text');
  const holdSecText = document.getElementById('hold-sec');
  const timerBadge = document.getElementById('timer-badge');

  let holdCounter = 0;

  function calculateAngle(a, b, c) {
    const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let angle = Math.abs(radians * 180.0 / Math.PI);
    if (angle > 180.0) angle = 360 - angle;
    return Math.round(angle);
  }

  function onResults(results) {
    if (!results.image) return;

    canvasElement.width = videoElement.videoWidth || 1280;
    canvasElement.height = videoElement.videoHeight || 720;
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);
    canvasCtx.drawImage(results.image, 0, 0, w, h);

    let accuracy = 0;
    let status = "雙臂向兩側斜前下方展開（二位手）";
    let statusColor = "#FFA726";

    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const lShoulder = lm[11], rShoulder = lm[12];
      const lElbow = lm[13], rElbow = lm[14];
      const lWrist = lm[15], rWrist = lm[16];
      const lPinky = lm[17], rPinky = lm[18];
      const lIndex = lm[19], rIndex = lm[20];
      const lThumb = lm[21], rThumb = lm[22];

      const shoulderWidth = Math.abs(lShoulder.x - rShoulder.x);
      const wingspan = Math.abs(lIndex.x - rIndex.x);
      const avgShoulderY = (lShoulder.y + rShoulder.y) / 2;

      // --- 1. 高度上限與下限（杜絕手臂下垂作弊） ---
      // 手肘深度：手肘只能微低於肩膀，不能低於 0.28 個肩寬
      const lElbowDrop = lElbow.y - lShoulder.y;
      const rElbowDrop = rElbow.y - rShoulder.y;
      const isElbowHeightGood = (lElbowDrop >= -0.05 && lElbowDrop <= shoulderWidth * 0.28) &&
                                (rElbowDrop >= -0.05 && rElbowDrop <= shoulderWidth * 0.28);

      // 手腕深度：手腕只能在肩膀下方 0.05 ~ 0.45 個肩寬之間（剛好在胸前高度，照片中垂到腰腹直接出局）
      const lWristDrop = lWrist.y - lShoulder.y;
      const rWristDrop = rWrist.y - rShoulder.y;
      const isWristHeightGood = (lWristDrop >= shoulderWidth * 0.03 && lWristDrop <= shoulderWidth * 0.45) &&
                                (rWristDrop >= shoulderWidth * 0.03 && rWristDrop <= shoulderWidth * 0.45);

      // 嚴格判定是否垂落
      const isArmsDropped = (lWristDrop > shoulderWidth * 0.45) || (rWristDrop > shoulderWidth * 0.45) ||
                            (lElbowDrop > shoulderWidth * 0.28) || (rElbowDrop > shoulderWidth * 0.28);

      // --- 2. 水滴坡度（肩膀 -> 手肘 -> 手腕：平緩微傾斜） ---
      const lSlope = (lElbow.y >= lShoulder.y - 0.03) && (lWrist.y >= lElbow.y - 0.02);
      const rSlope = (rElbow.y >= rShoulder.y - 0.03) && (rWrist.y >= rElbow.y - 0.02);
      const isSlopeGood = lSlope && rSlope;

      // 檢查是否水平十字架平舉（手腕高於肩）
      const isHorizontalFlat = (lWrist.y < lShoulder.y + shoulderWidth * 0.02) || 
                               (rWrist.y < rShoulder.y + shoulderWidth * 0.02);

      // --- 3. 手肘微曲柔和（防關節完全打直鎖死） ---
      const leftElbowAngle = calculateAngle(lShoulder, lElbow, lWrist);
      const rightElbowAngle = calculateAngle(rShoulder, rElbow, rWrist);
      const isElbowCurved = (leftElbowAngle >= 145 && leftElbowAngle <= 174 && rightElbowAngle >= 145 && rightElbowAngle <= 174);

      // --- 4. 翼展幅寬（拉開但不過分硬扯） ---
      const isSpanGood = (wingspan >= shoulderWidth * 1.9 && wingspan <= shoulderWidth * 2.7);

      // --- 5. 左右平衡對稱性 ---
      const elbowDiff = Math.abs(lElbow.y - rElbow.y);
      const wristDiff = Math.abs(lWrist.y - rWrist.y);
      const isSymmetric = (elbowDiff <= shoulderWidth * 0.12) && (wristDiff <= shoulderWidth * 0.14);

      // 評分權重設計（下垂直接清零 40 分）
      let scoreHeight = (!isArmsDropped && isElbowHeightGood && isWristHeightGood) ? 40 : 0;
      let scoreSlope = (isSlopeGood && !isHorizontalFlat) ? 25 : 5;
      let scoreElbow = isElbowCurved ? 20 : (leftElbowAngle > 175 || rightElbowAngle > 175 ? 5 : 10);
      let scoreSymmetry = (isSymmetric && isSpanGood) ? 15 : 5;

      accuracy = Math.min(100, Math.max(0, scoreHeight + scoreSlope + scoreElbow + scoreSymmetry));

      // 繪製骨骼線
      function drawBone(p1, p2, color, thickness) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x * w, p1.y * h);
        canvasCtx.lineTo(p2.x * w, p2.y * h);
        canvasCtx.lineWidth = thickness;
        canvasCtx.strokeStyle = color;
        canvasCtx.stroke();
      }

      drawBone(lShoulder, rShoulder, '#FFFFFF', 3);
      drawBone(lShoulder, lElbow, '#00E5FF', 4);
      drawBone(lElbow, lWrist, '#00E5FF', 4);
      drawBone(rShoulder, rElbow, '#00E5FF', 4);
      drawBone(rElbow, rWrist, '#00E5FF', 4);

      // 手指微結構連線
      drawBone(lWrist, lIndex, '#E040FB', 2);
      drawBone(lWrist, lThumb, '#E040FB', 2);
      drawBone(lIndex, lPinky, '#E040FB', 2);
      drawBone(rWrist, rIndex, '#E040FB', 2);
      drawBone(rWrist, rThumb, '#E040FB', 2);
      drawBone(rIndex, rPinky, '#E040FB', 2);

      // 水平參考輔助線（讓學生看清楚標準二位手的高度範圍）
      const benchY = avgShoulderY + shoulderWidth * 0.25;
      drawBone({x: lElbow.x, y: benchY}, {x: rElbow.x, y: benchY}, 'rgba(0, 229, 255, 0.2)', 1);

      const keyPoints = [
        lShoulder, rShoulder, lElbow, rElbow, 
        lWrist, rWrist, 
        lPinky, rPinky, lIndex, rIndex, lThumb, rThumb
      ];

      keyPoints.forEach(p => {
        canvasCtx.beginPath();
        canvasCtx.arc(p.x * w, p.y * h, 6, 0, 2 * Math.PI);
        canvasCtx.fillStyle = accuracy >= 85 ? '#00E676' : '#00E5FF';
        canvasCtx.fill();
        canvasCtx.lineWidth = 1.5;
        canvasCtx.strokeStyle = '#FFFFFF';
        canvasCtx.stroke();
      });

      // 即時狀態提示
      if (accuracy >= 85) {
        status = "PERFECT 2ND! 完美斜前下流暢弧度!";
        statusColor = "#00E676";
        holdCounter++;
      } else {
        holdCounter = Math.max(0, holdCounter - 1);
        if (isArmsDropped) {
          status = "手臂太低！手肘與雙手抬起至胸高，切勿下垂！";
          statusColor = "#FF5252";
        } else if (isHorizontalFlat) {
          status = "不要平舉像十字架！肩膀放鬆，手臂順流向下！";
          statusColor = "#FF5252";
        } else if (!isSlopeGood) {
          status = "手腕微低於手肘！維持滑水道弧線！";
          statusColor = "#FF5252";
        } else if (!isSpanGood) {
          status = "雙臂向兩側充分延展拉開！";
          statusColor = "#FFA726";
        } else if (!isElbowCurved) {
          status = "手肘微曲柔和，切勿完全鎖死伸直！";
          statusColor = "#FFA726";
        } else if (!isSymmetric) {
          status = "左右兩翼等高平衡，核心穩住！";
          statusColor = "#FFA726";
        } else {
          status = "沉肩長頸，氣息從後背流向指尖！";
          statusColor = "#FFA726";
        }
      }
    }

    const holdSeconds = Math.floor(holdCounter / 20);
    holdSecText.innerText = holdSeconds;
    scoreText.innerText = accuracy + "%";
    energyFill.style.height = accuracy + "%";

    if (accuracy >= 85) {
      energyFill.style.backgroundColor = "#00E676";
      timerBadge.style.borderColor = "#00E676";
    } else {
      energyFill.style.backgroundColor = "#FF5252";
      timerBadge.style.borderColor = "#FF5252";
    }

    statusCard.innerText = status;
    statusCard.style.borderColor = statusColor;
    statusCard.style.color = statusColor;

    canvasCtx.restore();
  }

  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  camera.start().catch((err) => {
    console.error("Camera error:", err);
    statusCard.innerText = "無法開啟相機，請檢查瀏覽器相機權限！";
    statusCard.style.borderColor = "#FF5252";
    statusCard.style.color = "#FF5252";
  });
</script>
</body>
</html>
