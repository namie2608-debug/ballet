<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>芭蕾第二位置（修長弧形 3D 嚴格版）</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background: #000;
    }
    video { 
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .hud-header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 3px solid #00E676;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
      z-index: 10;
    }
    .timer-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: 4px solid #FF5252;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
      z-index: 10;
    }
    .timer-badge span {
      font-size: 11px;
      color: #aaa;
      margin-top: -2px;
    }
    .energy-bar-container {
      position: absolute;
      right: 25px;
      top: 100px;
      bottom: 100px;
      width: 28px;
      background: rgba(255,255,255,0.15);
      border: 2px solid #fff;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      z-index: 10;
    }
    .energy-bar-fill {
      width: 100%;
      height: 0%;
      background: #FF5252;
      transition: height 0.1s ease-out, background-color 0.2s;
    }
    .score-text {
      position: absolute;
      right: 15px;
      bottom: 60px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      width: 50px;
      text-align: center;
      z-index: 10;
    }
    .debug-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #e0e0e0;
      z-index: 10;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div id="stage-container">
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="output-canvas"></canvas>

  <div class="timer-badge" id="timer-badge">
    <div id="hold-sec">0</div>
    <span>HOLD(S)</span>
  </div>

  <div class="hud-header" id="status-card">
    雙臂向兩側流暢展開成第二位置（2nd Position）
  </div>

  <div class="energy-bar-container">
    <div class="energy-bar-fill" id="energy-fill"></div>
  </div>
  <div class="score-text" id="score-text">0%</div>

  <div class="debug-panel" id="debug-panel">
    3D手肘角: L --° / R --° (目標 130~168°)<br>
    微前弧度: -- cm (目標 4~42cm)<br>
    展開比例: -- 倍肩寬 (目標 2.6~4.6)
  </div>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output-canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const statusCard = document.getElementById('status-card');
  const energyFill = document.getElementById('energy-fill');
  const scoreText = document.getElementById('score-text');
  const holdSecText = document.getElementById('hold-sec');
  const timerBadge = document.getElementById('timer-badge');
  const debugPanel = document.getElementById('debug-panel');

  // 改用真實時間計算維持秒數，不受 FPS 影響
  let holdDurationMs = 0;
  let lastFrameTime = performance.now();

  // 使用真實 3D 世界座標計算手肘角度，避免 2D 畫面長寬比與透視變形
  function calculateAngle3D(a, b, c) {
    const v1 = { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z };
    const v2 = { x: c.x - b.x, y: c.y - b.y, z: c.z - b.z };
    const dot = v1.x * v2.x + v1.y * v2.y + v1.z * v2.z;
    const mag1 = Math.hypot(v1.x, v1.y, v1.z);
    const mag2 = Math.hypot(v2.x, v2.y, v2.z);
    if (mag1 === 0 || mag2 === 0) return 0;
    const cosAngle = Math.max(-1, Math.min(1, dot / (mag1 * mag2)));
    return Math.round(Math.acos(cosAngle) * 180.0 / Math.PI);
  }

  function onResults(results) {
    if (!results.image) return;

    const now = performance.now();
    const deltaTime = now - lastFrameTime;
    lastFrameTime = now;

    // 僅在尺寸變動時重設畫布，避免效能浪費
    const targetW = videoElement.videoWidth || 1280;
    const targetH = videoElement.videoHeight || 720;
    if (canvasElement.width !== targetW || canvasElement.height !== targetH) {
      canvasElement.width = targetW;
      canvasElement.height = targetH;
    }
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);
    canvasCtx.drawImage(results.image, 0, 0, w, h);

    let accuracy = 0;
    let status = "雙臂向兩側流暢展開成第二位置（2nd Position）";
    let statusColor = "#FFA726";

    if (results.poseLandmarks && results.poseWorldLandmarks) {
      const lm = results.poseLandmarks;
      const wl = results.poseWorldLandmarks; // 真實 3D 座標（單位：公尺）

      const lShoulder = lm[11], rShoulder = lm[12];
      const lElbow = lm[13], rElbow = lm[14];
      const lWrist = lm[15], rWrist = lm[16];
      const lPinky = lm[17], rPinky = lm[18];
      const lIndex = lm[19], rIndex = lm[20];
      const lThumb = lm[21], rThumb = lm[22];

      // 統一換算成真實像素距離，解決 16:9 / 9:16 比例尺失真
      const shoulderWidthPx = Math.hypot((lShoulder.x - rShoulder.x) * w, (lShoulder.y - rShoulder.y) * h);
      const wingspanPx = Math.abs(lIndex.x - rIndex.x) * w;
      const spanRatio = shoulderWidthPx > 0 ? (wingspanPx / shoulderWidthPx) : 0;

      // 1. 3D 手肘修長弧形檢核（130° ~ 168° 為自然微彎，>= 170° 視為死直）
      const leftElbowAngle = calculateAngle3D(wl[11], wl[13], wl[15]);
      const rightElbowAngle = calculateAngle3D(wl[12], wl[14], wl[16]);
      const isTooStraight = (leftElbowAngle >= 170 || rightElbowAngle >= 170);
      const isElbowCurved = (leftElbowAngle >= 130 && leftElbowAngle <= 168) &&
                            (rightElbowAngle >= 130 && rightElbowAngle <= 168);

      // 2. 坡度與高度檢核（修正原本 rWrist 誤減 lShoulder 的 Bug）
      const lElbowDropPx = (lElbow.y - lShoulder.y) * h;
      const rElbowDropPx = (rElbow.y - rShoulder.y) * h;
      const lWristDropPx = (lWrist.y - lShoulder.y) * h;
      const rWristDropPx = (rWrist.y - rShoulder.y) * h;

      // 手肘微低於肩（0 ~ 0.45 倍肩寬），手腕順勢再微低於手肘（0.05 ~ 0.75 倍肩寬）
      const isElbowHeightGood = (lElbowDropPx >= -shoulderWidthPx * 0.05 && lElbowDropPx <= shoulderWidthPx * 0.45) &&
                                (rElbowDropPx >= -shoulderWidthPx * 0.05 && rElbowDropPx <= shoulderWidthPx * 0.45);
      const isWristHeightGood = (lWristDropPx >= shoulderWidthPx * 0.05 && lWristDropPx <= shoulderWidthPx * 0.75) &&
                                (rWristDropPx >= shoulderWidthPx * 0.05 && rWristDropPx <= shoulderWidthPx * 0.75);
      const isSmoothDownSlope = ((lWrist.y - lElbow.y) * h >= -shoulderWidthPx * 0.05) &&
                                ((rWrist.y - rElbow.y) * h >= -shoulderWidthPx * 0.05);
      const isSlopeGood = isElbowHeightGood && isWristHeightGood && isSmoothDownSlope;

      // 3. 3D 微前弧度檢核（第二位置手臂必須在身體「微前方」，不能往後拉超過肩膀）
      // wl 中 z 越小代表越靠近鏡頭，正值代表手腕在肩膀前方
      const lForwardM = wl[11].z - wl[15].z;
      const rForwardM = wl[12].z - wl[16].z;
      const isPulledBack = (lForwardM < 0.04 || rForwardM < 0.04);
      const isForwardCurveGood = (lForwardM >= 0.04 && lForwardM <= 0.42) &&
                                 (rForwardM >= 0.04 && rForwardM <= 0.42);

      // 4. 兩側展開幅度（修正為符合真實人體比例的 2.6 ~ 4.6 倍肩寬）
      const isSpanGood = (spanRatio >= 2.6 && spanRatio <= 4.6);

      // 5. 左右對稱性（像素基準）
      const elbowDiffPx = Math.abs(lElbow.y - rElbow.y) * h;
      const wristDiffPx = Math.abs(lWrist.y - rWrist.y) * h;
      const isSymmetric = (elbowDiffPx <= shoulderWidthPx * 0.18) && (wristDiffPx <= shoulderWidthPx * 0.22);

      // 更新左下角即時偵測數值面板
      const avgForwardCm = Math.round(((lForwardM + rForwardM) / 2) * 100);
      debugPanel.innerHTML =
        `3D手肘角: L <b style="color:${leftElbowAngle >= 130 && leftElbowAngle <= 168 ? '#00E676' : '#FF5252'}">${leftElbowAngle}°</b> / R <b style="color:${rightElbowAngle >= 130 && rightElbowAngle <= 168 ? '#00E676' : '#FF5252'}">${rightElbowAngle}°</b> (130~168°)<br>` +
        `微前弧度: <b style="color:${isForwardCurveGood ? '#00E676' : '#FF5252'}">${avgForwardCm} cm</b> (目標 4~42cm)<br>` +
        `展開比例: <b style="color:${isSpanGood ? '#00E676' : '#FFA726'}">${spanRatio.toFixed(2)}</b> 倍肩寬 (目標 2.6~4.6)`;

      // 評分配置（總分 100 分）
      let scoreElbow = isTooStraight ? 0 : (isElbowCurved ? 30 : 10);
      let scoreSlope = isSlopeGood ? 25 : 5;
      let scoreForward = isForwardCurveGood ? 20 : 0;
      let scoreSpan = isSpanGood ? 15 : 5;
      let scoreSymmetry = isSymmetric ? 10 : 0;

      accuracy = Math.min(100, Math.max(0, scoreElbow + scoreSlope + scoreForward + scoreSpan + scoreSymmetry));

      // 嚴格門檻：若手臂死直或往後拉過頭，分數最高鎖定在 70%
      if (isTooStraight || isPulledBack) {
        accuracy = Math.min(accuracy, 70);
      }

      // 繪製骨骼線
      function drawBone(p1, p2, color, thickness) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x * w, p1.y * h);
        canvasCtx.lineTo(p2.x * w, p2.y * h);
        canvasCtx.lineWidth = thickness;
        canvasCtx.strokeStyle = color;
        canvasCtx.stroke();
      }

      drawBone(lShoulder, rShoulder, '#FFFFFF', 3);
      drawBone(lShoulder, lElbow, '#00E5FF', 4);
      drawBone(lElbow, lWrist, '#00E5FF', 4);
      drawBone(rShoulder, rElbow, '#00E5FF', 4);
      drawBone(rElbow, rWrist, '#00E5FF', 4);

      // 手指微結構
      drawBone(lWrist, lIndex, '#E040FB', 2);
      drawBone(lWrist, lThumb, '#E040FB', 2);
      drawBone(lIndex, lPinky, '#E040FB', 2);
      drawBone(rWrist, rIndex, '#E040FB', 2);
      drawBone(rWrist, rThumb, '#E040FB', 2);
      drawBone(rIndex, rPinky, '#E040FB', 2);

      const keyPoints = [
        lShoulder, rShoulder, lElbow, rElbow, 
        lWrist, rWrist, 
        lPinky, rPinky, lIndex, rIndex, lThumb, rThumb
      ];

      keyPoints.forEach(p => {
        canvasCtx.beginPath();
        canvasCtx.arc(p.x * w, p.y * h, 6, 0, 2 * Math.PI);
        canvasCtx.fillStyle = accuracy >= 85 ? '#00E676' : '#00E5FF';
        canvasCtx.fill();
        canvasCtx.lineWidth = 1.5;
        canvasCtx.strokeStyle = '#FFFFFF';
        canvasCtx.stroke();
      });

      // 即時狀態回饋
      if (accuracy >= 85) {
        status = "PERFECT 2ND! 完美微曲向下流暢弧度!";
        statusColor = "#00E676";
        holdDurationMs += deltaTime;
      } else {
        holdDurationMs = Math.max(0, holdDurationMs - deltaTime);
        if (isTooStraight) {
          status = "手肘過於僵硬死直！請放鬆維持修長微彎弧形！";
          statusColor = "#FF5252";
        } else if (isPulledBack) {
          status = "手臂拉太後面了！請往前收回至視線餘光微前方！";
          statusColor = "#FF5252";
        } else if (!isSlopeGood) {
          status = "手肘與手腕順流向下，保持優雅坡度！";
          statusColor = "#FF5252";
        } else if (!isSpanGood) {
          status = "雙臂向兩側充分延伸展開！";
          statusColor = "#FFA726";
        } else if (!isSymmetric) {
          status = "左右兩側高度保持對稱平衡！";
          statusColor = "#FFA726";
        } else {
          status = "沉肩長頸，維持天鵝翅膀的修長弧線！";
          statusColor = "#FFA726";
        }
      }
    } else {
      holdDurationMs = 0;
    }

    const holdSeconds = Math.floor(holdDurationMs / 1000);
    holdSecText.innerText = holdSeconds;
    scoreText.innerText = accuracy + "%";
    energyFill.style.height = accuracy + "%";

    if (accuracy >= 85) {
      energyFill.style.backgroundColor = "#00E676";
      timerBadge.style.borderColor = "#00E676";
    } else {
      energyFill.style.backgroundColor = "#FF5252";
      timerBadge.style.borderColor = "#FF5252";
    }

    statusCard.innerText = status;
    statusCard.style.borderColor = statusColor;
    statusCard.style.color = statusColor;

    canvasCtx.restore();
  }

  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  camera.start().catch((err) => {
    console.error("Camera error:", err);
    statusCard.innerText = "無法開啟相機，請檢查瀏覽器相機權限！";
    statusCard.style.borderColor = "#FF5252";
    statusCard.style.color = "#FF5252";
  });
</script>
</body>
</html>
