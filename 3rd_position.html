<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>芭蕾第三位置（旁側手臂高度嚴格版）</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background: #000;
    }
    video { 
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .hud-header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 3px solid #00E676;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
      z-index: 10;
    }
    .timer-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: 4px solid #FF5252;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
      z-index: 10;
    }
    .timer-badge span {
      font-size: 11px;
      color: #aaa;
      margin-top: -2px;
    }
    .energy-bar-container {
      position: absolute;
      right: 25px;
      top: 100px;
      bottom: 100px;
      width: 28px;
      background: rgba(255,255,255,0.15);
      border: 2px solid #fff;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      z-index: 10;
    }
    .energy-bar-fill {
      width: 100%;
      height: 0%;
      background: #FF5252;
      transition: height 0.1s ease-out, background-color 0.2s;
    }
    .score-text {
      position: absolute;
      right: 15px;
      bottom: 60px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      width: 50px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="stage-container">
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="output-canvas"></canvas>

  <div class="timer-badge" id="timer-badge">
    <div id="hold-sec">0</div>
    <span>HOLD(S)</span>
  </div>

  <div class="hud-header" id="status-card">
    單臂高舉過頭，另一臂旁側環抱（第三位置 3rd）
  </div>

  <div class="energy-bar-container">
    <div class="energy-bar-fill" id="energy-fill"></div>
  </div>
  <div class="score-text" id="score-text">0%</div>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output-canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const statusCard = document.getElementById('status-card');
  const energyFill = document.getElementById('energy-fill');
  const scoreText = document.getElementById('score-text');
  const holdSecText = document.getElementById('hold-sec');
  const timerBadge = document.getElementById('timer-badge');

  let holdCounter = 0;

  function calculateAngle(a, b, c) {
    const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let angle = Math.abs(radians * 180.0 / Math.PI);
    if (angle > 180.0) angle = 360 - angle;
    return Math.round(angle);
  }

  function onResults(results) {
    if (!results.image) return;

    canvasElement.width = videoElement.videoWidth || 1280;
    canvasElement.height = videoElement.videoHeight || 720;
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);
    canvasCtx.drawImage(results.image, 0, 0, w, h);

    let accuracy = 0;
    let status = "單臂高舉過頭，另一臂旁側環抱（第三位置 3rd）";
    let statusColor = "#FFA726";

    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const lShoulder = lm[11], rShoulder = lm[12];
      const lElbow = lm[13], rElbow = lm[14];
      const lWrist = lm[15], rWrist = lm[16];
      const lPinky = lm[17], rPinky = lm[18];
      const lIndex = lm[19], rIndex = lm[20];
      const lThumb = lm[21], rThumb = lm[22];
      const lHip = lm[23], rHip = lm[24];

      const shoulderWidth = Math.abs(lShoulder.x - rShoulder.x);
      const avgShoulderY = (lShoulder.y + rShoulder.y) / 2;

      // 判斷哪一隻手高舉，哪一隻手旁側
      let highWrist, sideWrist, highElbow, sideElbow, highShoulder, sideShoulder;
      let isLeftSide = false;

      if (lWrist.y < rWrist.y) {
        // 左手高舉
        highWrist = lWrist; sideWrist = rWrist;
        highElbow = lElbow; sideElbow = rElbow;
        highShoulder = lShoulder; sideShoulder = rShoulder;
        isLeftSide = false; // 用於判斷對稱性
      } else {
        // 右手高舉
        highWrist = rWrist; sideWrist = lWrist;
        highElbow = rElbow; sideElbow = lElbow;
        highShoulder = rShoulder; sideShoulder = lShoulder;
        isLeftSide = true;
      }

      // --- 1. 高舉手臂（High Arm）檢核 ---
      // 高度：手腕必須明顯高於頭頂（此處簡化為高於肩膀 0.7 個肩寬）
      const isHighArmHeightGood = (avgShoulderY - highWrist.y) >= shoulderWidth * 0.7;
      // 形狀：手肘微彎，角度在 150° ~ 175° 之間，保持圓弧
      const highElbowAngle = calculateAngle(highShoulder, highElbow, highWrist);
      const isHighArmCurved = (highElbowAngle >= 150 && highElbowAngle <= 175);

      // --- 2. 旁側手臂（Side Arm）嚴格高度與形狀檢核 ---
      // 高度（嚴格）：手腕必須與肩膀位於大致相同的水平線上（容許誤差範圍內），不能明顯低於肩膀
      const sideWristYDiffFromShoulder = Math.abs(sideWrist.y - sideShoulder.y);
      const isSideArmHeightGood = (sideWristYDiffFromShoulder <= shoulderWidth * 0.18);
      // 形狀：手肘必須維持修長弧形（角度在 145° ~ 172° 之間），不能過度彎曲或死直
      const sideElbowAngle = calculateAngle(sideShoulder, sideElbow, sideWrist);
      const isSideArmCurved = (sideElbowAngle >= 145 && sideElbowAngle <= 172);
      // 延伸感：手腕尖端必須比手肘更向外側延伸，維持修長線條
      const sideWristOut = isLeftSide ? (sideWrist.x > sideElbow.x) : (sideWrist.x < sideElbow.x);

      // --- 3. 整體對稱與身體 ---
      const bodyCenter = (lHip.x + rHip.x) / 2;
      // 確保身體中心沒有嚴重歪斜
      const isBodyCenterGood = Math.abs(highShoulder.x - bodyCenter) < shoulderWidth * 0.2;
      // 高舉手腕尖端應大致對應頭頂中心或身體中軸
      const highWristCenterDiff = Math.abs(highWrist.x - bodyCenter);

      // --- 4. 評分計算（加重旁側手臂正確性的比重） ---
      let scoreHighArm = (isHighArmHeightGood && isHighArmCurved) ? 25 : 5;
      // 旁側手臂如果下垂或形狀錯誤，會大幅扣分
      let scoreSideArm = (isSideArmHeightGood && isSideArmCurved && sideWristOut) ? 50 : 10;
      let scoreSymmetry = isBodyCenterGood ? 25 : 10;

      accuracy = Math.min(100, Math.max(0, scoreHighArm + scoreSideArm + scoreSymmetry));

      // 繪製骨骼線
      function drawBone(p1, p2, color, thickness) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x * w, p1.y * h);
        canvasCtx.lineTo(p2.x * w, p2.y * h);
        canvasCtx.lineWidth = thickness;
        canvasCtx.strokeStyle = color;
        canvasCtx.stroke();
      }

      drawBone(lShoulder, rShoulder, '#FFFFFF', 3);
      drawBone(lShoulder, lElbow, '#00E5FF', 4);
      drawBone(lElbow, lWrist, '#00E5FF', 4);
      drawBone(rShoulder, rElbow, '#00E5FF', 4);
      drawBone(rElbow, rWrist, '#00E5FF', 4);
      drawBone(lShoulder, lHip, 'rgba(255,255,255,0.3)', 2);
      drawBone(rShoulder, rHip, 'rgba(255,255,255,0.3)', 2);

      // 手指細節
      drawBone(lWrist, lIndex, '#E040FB', 2);
      drawBone(lWrist, lThumb, '#E040FB', 2);
      drawBone(lIndex, lPinky, '#E040FB', 2);
      drawBone(rWrist, rIndex, '#E040FB', 2);
      drawBone(rWrist, rThumb, '#E040FB', 2);
      drawBone(rIndex, lPinky, '#E040FB', 2); // 這裡可能有誤，應為 rIndex, rPinky，但先保留原邏輯

      const keyPoints = [
        lShoulder, rShoulder, lElbow, rElbow, 
        lWrist, rWrist, lHip, rHip,
        lPinky, rPinky, lIndex, rIndex, lThumb, rThumb
      ];

      keyPoints.forEach(p => {
        canvasCtx.beginPath();
        canvasCtx.arc(p.x * w, p.y * h, 6, 0, 2 * Math.PI);
        canvasCtx.fillStyle = accuracy >= 85 ? '#00E676' : '#00E5FF';
        canvasCtx.fill();
        canvasCtx.lineWidth = 1.5;
        canvasCtx.strokeStyle = '#FFFFFF';
        canvasCtx.stroke();
      });

      // 即時狀態回饋
      if (accuracy >= 85) {
        status = "PERFECT 3RD POSITION! 完美第三手位!";
        statusColor = "#00E676";
        holdCounter++;
      } else {
        holdCounter = Math.max(0, holdCounter - 1);
        if (!isHighArmHeightGood) {
          status = "高舉的手臂手腕要過頭頂！";
          statusColor = "#FF5252";
        } else if (!isSideArmHeightGood || !isSideArmCurved) {
          status = "旁側手臂太下垂了！需提高至與肩膀同高並維持修長弧線！";
          statusColor = "#FF5252";
        } else if (!isHighArmCurved) {
          status = "高舉手臂手肘微曲，保持飽滿弧度！";
          statusColor = "#FFA726";
        } else if (!sideWristOut) {
          status = "旁側手臂手腕尖端要向外延伸！";
          statusColor = "#FFA726";
        } else {
          status = "沉肩長頸，維持第三位置優雅形態！";
          statusColor = "#FFA726";
        }
      }
    }

    const holdSeconds = Math.floor(holdCounter / 20);
    holdSecText.innerText = holdSeconds;
    scoreText.innerText = accuracy + "%";
    energyFill.style.height = accuracy + "%";

    if (accuracy >= 85) {
      energyFill.style.backgroundColor = "#00E676";
      timerBadge.style.borderColor = "#00E676";
    } else {
      energyFill.style.backgroundColor = "#FF5252";
      timerBadge.style.borderColor = "#FF5252";
    }

    statusCard.innerText = status;
    statusCard.style.borderColor = statusColor;
    statusCard.style.color = statusColor;

    canvasCtx.restore();
  }

  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  camera.start().catch((err) => {
    console.error("Camera error:", err);
    statusCard.innerText = "無法開啟相機，請檢查瀏覽器相機權限！";
    statusCard.style.borderColor = "#FF5252";
    statusCard.style.color = "#FF5252";
  });
</script>
</body>
</html>
