<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>芭蕾第四手位（4th Position）體感評測機</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background: #000;
    }
    video { 
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .hud-header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 3px solid #00E676;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
      z-index: 10;
    }
    .timer-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: 4px solid #FF5252;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
      z-index: 10;
    }
    .timer-badge span {
      font-size: 11px;
      color: #aaa;
      margin-top: -2px;
    }
    .energy-bar-container {
      position: absolute;
      right: 25px;
      top: 100px;
      bottom: 100px;
      width: 28px;
      background: rgba(255,255,255,0.15);
      border: 2px solid #fff;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      z-index: 10;
    }
    .energy-bar-fill {
      width: 100%;
      height: 0%;
      background: #FF5252;
      transition: height 0.1s ease-out, background-color 0.2s;
    }
    .score-text {
      position: absolute;
      right: 15px;
      bottom: 60px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      width: 50px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="stage-container">
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="output-canvas"></canvas>

  <div class="timer-badge" id="timer-badge">
    <div id="hold-sec">0</div>
    <span>HOLD(S)</span>
  </div>

  <div class="hud-header" id="status-card">
    請入鏡：一手頭頂抱圓、一手胸前抱圓（第四手位）
  </div>

  <div class="energy-bar-container">
    <div class="energy-bar-fill" id="energy-fill"></div>
  </div>
  <div class="score-text" id="score-text">0%</div>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output-canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const statusCard = document.getElementById('status-card');
  const energyFill = document.getElementById('energy-fill');
  const scoreText = document.getElementById('score-text');
  const holdSecText = document.getElementById('hold-sec');
  const timerBadge = document.getElementById('timer-badge');

  let holdCounter = 0;

  function calculateAngle(a, b, c) {
    const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let angle = Math.abs(radians * 180.0 / Math.PI);
    if (angle > 180.0) angle = 360 - angle;
    return Math.round(angle);
  }

  function onResults(results) {
    if (!results.image) return;

    canvasElement.width = videoElement.videoWidth || 1280;
    canvasElement.height = videoElement.videoHeight || 720;
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);
    canvasCtx.drawImage(results.image, 0, 0, w, h);

    let accuracy = 0;
    let status = "一手頭頂抱圓、一手胸前抱圓（第四手位）";
    let statusColor = "#FFA726";

    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const nose = lm[0];
      const lShoulder = lm[11], rShoulder = lm[12];
      const lElbow = lm[13], rElbow = lm[14];
      const lWrist = lm[15], rWrist = lm[16];
      const lPinky = lm[17], rPinky = lm[18];
      const lIndex = lm[19], rIndex = lm[20];
      const lThumb = lm[21], rThumb = lm[22];

      const shoulderWidth = Math.abs(lShoulder.x - rShoulder.x);
      const avgShoulderY = (lShoulder.y + rShoulder.y) / 2;

      // 辨別哪一手為上方手
      const isLeftHigh = lWrist.y < rWrist.y;
      const highWrist = isLeftHigh ? lWrist : rWrist;
      const highElbow = isLeftHigh ? lElbow : rElbow;
      const highShoulder = isLeftHigh ? lShoulder : rShoulder;

      const lowWrist = isLeftHigh ? rWrist : lWrist;
      const lowElbow = isLeftHigh ? rElbow : lElbow;
      const lowShoulder = isLeftHigh ? rShoulder : lShoulder;
      const lowIndex = isLeftHigh ? rIndex : lIndex;

      // 1. 上方手（五位手高弧度）滿分 35 分
      const isHighOverHead = (highWrist.y < nose.y - shoulderWidth * 0.08);
      const highAngle = calculateAngle(highShoulder, highElbow, highWrist);
      const isHighCurved = (highAngle >= 110 && highAngle <= 165);
      const isHighForward = (highWrist.z < highShoulder.z + 0.06);

      let scoreHigh = 0;
      if (isHighOverHead && isHighCurved && isHighForward) {
        scoreHigh = 35;
      } else if (isHighOverHead) {
        scoreHigh = 20;
      } else {
        scoreHigh = 5;
      }

      // 2. 胸前手（一位手弧度）滿分 35 分
      // 高度在下胸到肚臍之間
      const lowWristDepth = lowWrist.y - avgShoulderY;
      const isLowHeightGood = (lowWristDepth >= shoulderWidth * 0.35 && lowWristDepth <= shoulderWidth * 0.95);
      // 手肘架開向外
      const isLowElbowFlared = Math.abs(lowElbow.x - nose.x) >= shoulderWidth * 0.55;
      // 手腕收攏在胸前中軸線附近
      const isLowCentered = Math.abs(lowIndex.x - nose.x) <= shoulderWidth * 0.45;
      // 手肘弧度微曲
      const lowAngle = calculateAngle(lowShoulder, lowElbow, lowWrist);
      const isLowCurved = (lowAngle >= 85 && lowAngle <= 150);

      let scoreLow = 0;
      if (isLowHeightGood && isLowElbowFlared && isLowCentered && isLowCurved) {
        scoreLow = 35;
      } else if (isLowHeightGood && isLowCurved) {
        scoreLow = 22;
      } else {
        scoreLow = 5;
      }

      // 3. 軀幹中軸水平與穩定度 滿分 30 分
      const shoulderTilt = Math.abs(lShoulder.y - rShoulder.y);
      let scoreTorso = 0;
      if (shoulderTilt <= shoulderWidth * 0.15) {
        scoreTorso = 30;
      } else if (shoulderTilt <= shoulderWidth * 0.22) {
        scoreTorso = 15;
      } else {
        scoreTorso = 5;
      }

      accuracy = Math.min(100, Math.max(0, scoreHigh + scoreLow + scoreTorso));

      // 骨骼繪製
      function drawBone(p1, p2, color, thickness) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x * w, p1.y * h);
        canvasCtx.lineTo(p2.x * w, p2.y * h);
        canvasCtx.lineWidth = thickness;
        canvasCtx.strokeStyle = color;
        canvasCtx.stroke();
      }

      drawBone(lShoulder, rShoulder, '#FFFFFF', 3);
      drawBone(lShoulder, lElbow, '#00E5FF', 4);
      drawBone(lElbow, lWrist, '#00E5FF', 4);
      drawBone(rShoulder, rElbow, '#00E5FF', 4);
      drawBone(rElbow, rWrist, '#00E5FF', 4);

      // 手部微結構
      drawBone(lWrist, lIndex, '#E040FB', 2);
      drawBone(lWrist, lThumb, '#E040FB', 2);
      drawBone(lIndex, lPinky, '#E040FB', 2);
      drawBone(rWrist, rIndex, '#E040FB', 2);
      drawBone(rWrist, rThumb, '#E040FB', 2);
      drawBone(rIndex, rPinky, '#E040FB', 2);

      // 上下雙圓輔助導引線
      drawBone(highWrist, nose, accuracy >= 85 ? 'rgba(0, 230, 118, 0.4)' : 'rgba(255, 255, 255, 0.2)', 1);
      drawBone(lowWrist, {x: nose.x, y: avgShoulderY + shoulderWidth * 0.55}, accuracy >= 85 ? 'rgba(0, 230, 118, 0.4)' : 'rgba(255, 255, 255, 0.2)', 1);

      const keyPoints = [
        lShoulder, rShoulder, lElbow, rElbow, 
        lWrist, rWrist, 
        lPinky, rPinky, lIndex, rIndex, lThumb, rThumb
      ];

      keyPoints.forEach(p => {
        canvasCtx.beginPath();
        canvasCtx.arc(p.x * w, p.y * h, 6, 0, 2 * Math.PI);
        canvasCtx.fillStyle = accuracy >= 85 ? '#00E676' : '#00E5FF';
        canvasCtx.fill();
        canvasCtx.lineWidth = 1.5;
        canvasCtx.strokeStyle = '#FFFFFF';
        canvasCtx.stroke();
      });

      // 提示回饋
      if (accuracy >= 85) {
        status = "PERFECT 4TH POSITION! 完美第四手位!";
        statusColor = "#00E676";
        holdCounter++;
      } else {
        holdCounter = Math.max(0, holdCounter - 1);
        if (!isHighOverHead) {
          status = "一手向上提至額頭前上方抱圓！";
          statusColor = "#FF5252";
        } else if (!isLowHeightGood) {
          status = "另一手放在胸骨下方、肚臍上方抱圓！";
          statusColor = "#FF5252";
        } else if (!isLowCentered) {
          status = "胸前手向身體正中線收攏，保持圓潤！";
          statusColor = "#FFA726";
        } else if (shoulderTilt > shoulderWidth * 0.15) {
          status = "沉肩！身體中軸站直，勿被上方手拉歪！";
          statusColor = "#FF5252";
        } else if (!isHighCurved || !isLowCurved) {
          status = "雙手手肘皆微曲抱圓，切勿鎖死！";
          statusColor = "#FFA726";
        } else {
          status = "沉肩長頸，維持前後立體抱圓！";
          statusColor = "#FFA726";
        }
      }
    }

    const holdSeconds = Math.floor(holdCounter / 20);
    holdSecText.innerText = holdSeconds;
    scoreText.innerText = accuracy + "%";
    energyFill.style.height = accuracy + "%";

    if (accuracy >= 85) {
      energyFill.style.backgroundColor = "#00E676";
      timerBadge.style.borderColor = "#00E676";
    } else {
      energyFill.style.backgroundColor = "#FF5252";
      timerBadge.style.borderColor = "#FF5252";
    }

    statusCard.innerText = status;
    statusCard.style.borderColor = statusColor;
    statusCard.style.color = statusColor;

    canvasCtx.restore();
  }

  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  camera.start().catch((err) => {
    console.error("Camera error:", err);
    statusCard.innerText = "無法開啟相機，請檢查瀏覽器相機權限！";
    statusCard.style.borderColor = "#FF5252";
    statusCard.style.color = "#FF5252";
  });
</script>
</body>
</html>
