<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>芭蕾第四手位（下方手臂胃部高度嚴格版）</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background: #000;
    }
    video { 
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .hud-header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 3px solid #00E676;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
      z-index: 10;
    }
    .timer-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: 4px solid #FF5252;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
      z-index: 10;
    }
    .timer-badge span {
      font-size: 11px;
      color: #aaa;
      margin-top: -2px;
    }
    .energy-bar-container {
      position: absolute;
      right: 25px;
      top: 100px;
      bottom: 100px;
      width: 28px;
      background: rgba(255,255,255,0.15);
      border: 2px solid #fff;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      z-index: 10;
    }
    .energy-bar-fill {
      width: 100%;
      height: 0%;
      background: #FF5252;
      transition: height 0.1s ease-out, background-color 0.2s;
    }
    .score-text {
      position: absolute;
      right: 15px;
      bottom: 60px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      width: 50px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="stage-container">
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="output-canvas"></canvas>

  <div class="timer-badge" id="timer-badge">
    <div id="hold-sec">0</div>
    <span>HOLD(S)</span>
  </div>

  <div class="hud-header" id="status-card">
    單臂高舉過頭，另一臂於胃部前方環抱（第四位置 4th）
  </div>

  <div class="energy-bar-container">
    <div class="energy-bar-fill" id="energy-fill"></div>
  </div>
  <div class="score-text" id="score-text">0%</div>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output-canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const statusCard = document.getElementById('status-card');
  const energyFill = document.getElementById('energy-fill');
  const scoreText = document.getElementById('score-text');
  const holdSecText = document.getElementById('hold-sec');
  const timerBadge = document.getElementById('timer-badge');

  let holdCounter = 0;

  function calculateAngle(a, b, c) {
    const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let angle = Math.abs(radians * 180.0 / Math.PI);
    if (angle > 180.0) angle = 360 - angle;
    return Math.round(angle);
  }

  function onResults(results) {
    if (!results.image) return;

    canvasElement.width = videoElement.videoWidth || 1280;
    canvasElement.height = videoElement.videoHeight || 720;
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);
    canvasCtx.drawImage(results.image, 0, 0, w, h);

    let accuracy = 0;
    let status = "單臂高舉過頭，另一臂於胃部前方環抱（第四位置 4th）";
    let statusColor = "#FFA726";

    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const lShoulder = lm[11], rShoulder = lm[12];
      const lElbow = lm[13], rElbow = lm[14];
      const lWrist = lm[15], rWrist = lm[16];
      const lPinky = lm[17], rPinky = lm[18];
      const lIndex = lm[19], rIndex = lm[20];
      const lThumb = lm[21], rThumb = lm[22];
      const lHip = lm[23], rHip = lm[24];

      const shoulderWidth = Math.abs(lShoulder.x - rShoulder.x);
      const avgShoulderY = (lShoulder.y + rShoulder.y) / 2;

      // 判斷哪一隻手高舉，哪一隻手在前下方
      let highWrist, lowWrist, highElbow, lowElbow, highShoulder, lowShoulder;

      if (lWrist.y < rWrist.y) {
        highWrist = lWrist; lowWrist = rWrist;
        highElbow = lElbow; lowElbow = rElbow;
        highShoulder = lShoulder; lowShoulder = rShoulder;
      } else {
        highWrist = rWrist; lowWrist = lWrist;
        highElbow = rElbow; lowElbow = lElbow;
        highShoulder = rShoulder; lowShoulder = lShoulder;
      }

      // --- 1. 高舉手臂檢核 ---
      const isHighArmHeightGood = (avgShoulderY - highWrist.y) >= shoulderWidth * 0.7;
      const highElbowAngle = calculateAngle(highShoulder, highElbow, highWrist);
      const isHighArmCurved = (highElbowAngle >= 150 && highElbowAngle <= 175);

      // --- 2. 下方手臂（Low Arm）嚴格對齊第一手位高度檢核 ---
      // 手腕必須位於胃部高度（肩膀下方 0.28 ~ 0.65 個肩寬），嚴禁像第一張圖那樣掉到腹部下方（> 0.65）
      const lowWristDrop = lowWrist.y - avgShoulderY;
      const isLowArmHeightPerfect = (lowWristDrop >= shoulderWidth * 0.28 && lowWristDrop <= shoulderWidth * 0.65);
      const isLowArmTooLow = (lowWristDrop > shoulderWidth * 0.65);

      // 下方手臂手肘弧度（類似第一手位，保持優雅微彎）
      const lowElbowAngle = calculateAngle(lowShoulder, lowElbow, lowWrist);
      const isLowArmCurved = (lowElbowAngle >= 85 && lowElbowAngle <= 145);

      // --- 3. 身體平衡 ---
      const bodyCenter = (lHip.x + rHip.x) / 2;
      const isBodyCenterGood = Math.abs(highShoulder.x - bodyCenter) < shoulderWidth * 0.2;

      // --- 4. 評分計算 ---
      let scoreHighArm = (isHighArmHeightGood && isHighArmCurved) ? 30 : 10;
      // 下方手臂太低直接扣重分
      let scoreLowArm = isLowArmHeightPerfect ? 45 : (isLowArmTooLow ? 0 : 15);
      let scoreSymmetry = isBodyCenterGood ? 25 : 10;

      accuracy = Math.min(100, Math.max(0, scoreHighArm + scoreLowArm + scoreSymmetry));

      // 繪製骨骼線
      function drawBone(p1, p2, color, thickness) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x * w, p1.y * h);
        canvasCtx.lineTo(p2.x * w, p2.y * h);
        canvasCtx.lineWidth = thickness;
        canvasCtx.strokeStyle = color;
        canvasCtx.stroke();
      }

      drawBone(lShoulder, rShoulder, '#FFFFFF', 3);
      drawBone(lShoulder, lElbow, '#00E5FF', 4);
      drawBone(lElbow, lWrist, '#00E5FF', 4);
      drawBone(rShoulder, rElbow, '#00E5FF', 4);
      drawBone(rElbow, rWrist, '#00E5FF', 4);
      drawBone(lShoulder, lHip, 'rgba(255,255,255,0.3)', 2);
      drawBone(rShoulder, rHip, 'rgba(255,255,255,0.3)', 2);

      // 手指細節
      drawBone(lWrist, lIndex, '#E040FB', 2);
      drawBone(lWrist, lThumb, '#E040FB', 2);
      drawBone(lIndex, lPinky, '#E040FB', 2);
      drawBone(rWrist, rIndex, '#E040FB', 2);
      drawBone(rWrist, rThumb, '#E040FB', 2);
      drawBone(rIndex, rPinky, '#E040FB', 2);

      const keyPoints = [
        lShoulder, rShoulder, lElbow, rElbow, 
        lWrist, rWrist, lHip, rHip,
        lPinky, rPinky, lIndex, rIndex, lThumb, rThumb
      ];

      keyPoints.forEach(p => {
        canvasCtx.beginPath();
        canvasCtx.arc(p.x * w, p.y * h, 6, 0, 2 * Math.PI);
        canvasCtx.fillStyle = accuracy >= 85 ? '#00E676' : '#00E5FF';
        canvasCtx.fill();
        canvasCtx.lineWidth = 1.5;
        canvasCtx.strokeStyle = '#FFFFFF';
        canvasCtx.stroke();
      });

      // 即時狀態回饋
      if (accuracy >= 85) {
        status = "PERFECT 4TH POSITION! 完美第四手位!";
        statusColor = "#00E676";
        holdCounter++;
      } else {
        holdCounter = Math.max(0, holdCounter - 1);
        if (isLowArmTooLow) {
          status = "下方手臂太低了！必須如第一手位般維持在胃部前方！";
          statusColor = "#FF5252";
        } else if (!isHighArmHeightGood) {
          status = "高舉的手臂手腕要過頭頂！";
          statusColor = "#FF5252";
        } else if (!isLowArmCurved) {
          status = "下方手臂手肘向外撐開，維持胃前抱圓！";
          statusColor = "#FFA726";
        } else {
          status = "沉肩長頸，維持第四位置優雅形態！";
          statusColor = "#FFA726";
        }
      }
    }

    const holdSeconds = Math.floor(holdCounter / 20);
    holdSecText.innerText = holdSeconds;
    scoreText.innerText = accuracy + "%";
    energyFill.style.height = accuracy + "%";

    if (accuracy >= 85) {
      energyFill.style.backgroundColor = "#00E676";
      timerBadge.style.borderColor = "#00E676";
    } else {
      energyFill.style.backgroundColor = "#FF5252";
      timerBadge.style.borderColor = "#FF5252";
    }

    statusCard.innerText = status;
    statusCard.style.borderColor = statusColor;
    statusCard.style.color = statusColor;

    canvasCtx.restore();
  }

  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  camera.start().catch((err) => {
    console.error("Camera error:", err);
    statusCard.innerText = "無法開啟相機，請檢查瀏覽器相機權限！";
    statusCard.style.borderColor = "#FF5252";
    statusCard.style.color = "#FF5252";
  });
</script>
</body>
</html>
